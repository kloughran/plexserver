services:
  plex:
    image: plexinc/pms-docker
    container_name: plex
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - TZ=America/Chicago
      - LIBVA_DRIVER_NAME=radeonsi
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /media/container-storage/plex/plex-config:/config
      - /media/plexmedia:/data
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 8gb
